<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>枫间五子棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="leaf-deco leaf-deco-left" aria-hidden="true"></div>
  <div class="leaf-deco leaf-deco-right" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="返回首页">
      <span class="brand-mark">枫</span>
      <span class="brand-text">AUTUMN&nbsp;GOMOKU</span>
    </a>
    <button id="user-chip" class="user-chip" type="button" title="个人主页" aria-label="个人主页">
      <span id="user-chip-avatar" class="user-chip-avatar" aria-hidden="true"></span>
      <span id="user-chip-nick" class="user-chip-nick"></span>
    </button>
    <div id="connection-status" class="status" data-state="connecting">连接中…</div>
  </header>

  <main class="layout">
    <div class="hero">
      <p class="hero-en">Autumn · Five in a Row</p>
      <h1 class="hero-title">枫间五子棋<span class="hero-seal">弈</span></h1>
    </div>

    <section id="home-page" class="home-page">
      <p class="home-subtitle">落叶之间，手谈一局</p>
      <div class="mode-cards">
        <button type="button" class="mode-card" id="mode-ai">
          <span class="mode-name">人机对决</span>
          <span class="mode-desc">随时开局，无需联网</span>
          <span class="mode-meta">三档难度 · 自由执子</span>
        </button>
        <button type="button" class="mode-card" id="mode-pvp">
          <span class="mode-name">双人匹配</span>
          <span class="mode-desc">局域网 / 同网段实时对战</span>
          <span class="mode-meta">游客身份 · 无需登录</span>
        </button>
      </div>
      <div class="home-settings">
        <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true" data-state="on">
          <span class="sound-toggle-icon" aria-hidden="true">♪</span>
          <span>音效</span>
          <span class="sound-toggle-state" id="sound-toggle-state">开</span>
        </button>
      </div>
      <p class="home-version">枫间五子棋 v2.0</p>
    </section>

    <div id="game-info" class="game-info" data-turn="" hidden>
      <span class="turn-dot" aria-hidden="true"></span>
      <span id="turn-label" class="turn-label">等待开局…</span>
      <span class="info-divider" aria-hidden="true"></span>
      <span id="countdown" class="countdown" data-state="normal">5:00</span>
      <span id="round-time" class="round-time" hidden></span>
    </div>

    <section id="board-area" class="board-area">
      <canvas id="board-canvas"></canvas>

      <div id="match-overlay" class="match-overlay">
        <div class="match-panel">
          <h2 class="match-title">联机对战</h2>
          <p id="match-hint" class="match-hint">正在连接服务器…</p>
          <button id="match-button" class="match-button" type="button" disabled>开始匹配</button>
        </div>
      </div>

      <div id="result-overlay" class="result-overlay" hidden>
        <div class="result-panel">
          <h2 id="result-title" class="result-title">对局结束</h2>
          <p id="result-message" class="result-message"></p>
          <div class="result-actions">
            <button id="result-button" class="result-button" type="button">知道了</button>
            <button id="result-home-button" class="result-home" type="button" hidden>回首页</button>
          </div>
        </div>
      </div>
    </section>

    <section id="ai-page" class="ai-page" hidden></section>

    <section id="profile-page" class="profile-page" hidden></section>

    <p class="footer-caption">Five in a Row · Gomoku · Autumn Edition</p>
  </main>

  <script src="store.js"></script>
  <script src="assets/avatars.js"></script>
  <script src="avatar-picker.js"></script>
  <script src="profile-store.js"></script>
  <script src="stats-store.js"></script>
  <script src="settings-store.js"></script>
  <script src="profile-view.js"></script>
  <script src="router.js"></script>
  <script src="board-view.js"></script>
  <script src="ai.js"></script>
  <script src="ai-view.js"></script>
  <script src="match-view.js"></script>
  <script src="app.js"></script>
  <script src="ai-game.js"></script>
  <script>
    // T2-1 路由 + T2-2 首页模式选择（NAV-01/02/04、PROF-02）
    // #/ai 由 T3-5 注册（AI-01）；#/game 由 T3-6 注册。
    (function () {
      function boot() {
        var router = window.Gomoku.Router.create(window);
        var homePage = document.getElementById('home-page');
        var profilePage = document.getElementById('profile-page');
        var aiPage = document.getElementById('ai-page');
        var boardArea = document.getElementById('board-area');
        var gameInfo = document.getElementById('game-info');
        var hero = document.querySelector('.hero');

        // 视图互斥：同一时间只显示首页 / 人机设置 / 对局 / 个人主页
        function show(view) {
          homePage.hidden = view !== 'home';
          profilePage.hidden = view !== 'profile';
          aiPage.hidden = view !== 'ai';
          var inBoard = view === 'match' || view === 'game';
          boardArea.style.display = inBoard ? '' : 'none';
          gameInfo.hidden = !inBoard;
          hero.hidden = view === 'profile';
        }
        router.register('home', { mount: function () { show('home'); } });
        router.register('match', {
          mount: function () {
            show('match');
            if (window.Gomoku.activatePvpBoard) window.Gomoku.activatePvpBoard();
          },
        });
        router.register('profile', { mount: function () { show('profile'); } });
        router.register('ai', {
          mount: function (ctx) {
            show('ai');
            window.Gomoku.AiView.mount(aiPage, ctx);
          },
        });

        // 人机对局控制（T3-6）：复用棋盘视图与结果浮层，不依赖 WebSocket
        var aiGame = window.Gomoku.AiGame.create({
          boardView: window.Gomoku.boardView,
          playSound: window.Gomoku.playDropSound,
          unlockAudio: window.Gomoku.ensureAudioCtx,
          elements: {
            gameInfo: gameInfo,
            turnLabel: document.getElementById('turn-label'),
            countdown: document.getElementById('countdown'),
            roundTime: document.getElementById('round-time'),
            matchOverlay: document.getElementById('match-overlay'),
            resultOverlay: document.getElementById('result-overlay'),
            resultTitle: document.getElementById('result-title'),
            resultMessage: document.getElementById('result-message'),
            resultButton: document.getElementById('result-button'),
            resultHomeButton: document.getElementById('result-home-button'),
          },
        });
        window.Gomoku.aiGame = aiGame;
        router.register('game', {
          mount: function (ctx) {
            show('game');
            aiGame.mount(ctx);
          },
        });
        window.Gomoku.router = router;

        document.getElementById('mode-ai').addEventListener('click', function () {
          router.navigate('ai');
        });
        document.getElementById('mode-pvp').addEventListener('click', function () {
          router.navigate('match');
        });
        document.getElementById('user-chip').addEventListener('click', function () {
          router.navigate('profile');
        });

        // 顶栏用户芯片：头像 + 昵称，跟随档案变更（PROF-02/08）
        var chipAvatar = document.getElementById('user-chip-avatar');
        var chipNick = document.getElementById('user-chip-nick');
        function renderChip(p) {
          chipAvatar.innerHTML = p.avatarDataUrl
            ? '<img src="' + p.avatarDataUrl + '" alt="">'
            : window.Gomoku.Avatars.svg(p.avatarId, 28);
          chipNick.textContent = p.nickname;
        }
        window.Gomoku.ProfileStore.subscribe(renderChip);
        renderChip(window.Gomoku.ProfileStore.get());

        router.start();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
